[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobmarket-pipeline"
version = "1.0.0"
description = "Pipeline ETL des offres d'emploi data publiées sur France Travail (Prefect + Delta Lake)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ilyas Marouf" }]
dependencies = [
    "prefect>=3.0,<4",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "deltalake>=0.22",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
jobmarket = "jobmarket.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmarket"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.coverage.run]
source = ["jobmarket"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
